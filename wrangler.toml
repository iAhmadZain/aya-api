name = "aya-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Build disabled - data is pre-built
# [build]
# command = "npm run build:data"

# Production settings
[env.production]
name = "aya-api"
routes = [
  { pattern = "getaya.live/api/*", zone_name = "getaya.live" },
  { pattern = "getaya.live/v/*", zone_name = "getaya.live" },
  { pattern = "api.getaya.live/*", zone_name = "getaya.live" },
  { pattern = "aya.iahmadzain.me/*", zone_name = "iahmadzain.me" }  # Legacy
]
